[package]
name = "luks-ssh-unlock"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Unlock LUKS-encrypted hosts remotely by feeding their initrd the passphrase over SSH"
license = "GPL-3.0-only"
repository = "https://github.com/pschmitt/luks-ssh-unlock"
readme = "README.md"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
clap_complete = "4"
flate2 = "1.1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
libc = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tracing = "0.1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
url = "2"
vt100 = "0.16"
webpki-roots = "1"
zeroize = "1"
zune-jpeg = "0.5"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
