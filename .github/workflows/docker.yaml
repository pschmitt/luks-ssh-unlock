name: docker
on:
  push:
    branches: [main]
  pull_request: {}
  # Rebuild daily so the image picks up Alpine security updates.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Native amd64 and arm64 builds (no QEMU), published from main only.
  docker:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: pschmitt/ci-workflows/.github/workflows/docker-native.yaml@main
    with:
      image-name: pschmitt/luks-ssh-unlock
      registries: '["docker.io", "ghcr.io"]'
      publish: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    secrets:
      dockerhub_username: ${{ secrets.DOCKER_USERNAME }}
      dockerhub_password: ${{ secrets.DOCKER_PASSWORD }}
