name: build
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
env:
  RUST_BACKTRACE: 1
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Static release binaries, natively per architecture. Nix packages and
  # checks build on nixbot (nixbot.toml).
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # ring's C code: the runner's own musl-gcc matches the target arch.
      - run: TARGET_CC=musl-gcc cargo build --locked --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: luks-ssh-unlock-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/luks-ssh-unlock
          if-no-files-found: error
