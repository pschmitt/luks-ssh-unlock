[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-musl" },
]

[advisories]
version = 2
yanked = "deny"

[bans]
# ratatui's dependency tree carries a few duplicate versions; report them
# without failing the build.
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # TLS goes through rustls; OpenSSL would break the static musl builds.
    { name = "openssl-sys" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    # This crate itself.
    { name = "luks-ssh-unlock", allow = ["GPL-3.0-only"] },
    { name = "ring", allow = ["OpenSSL", "MIT", "ISC"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
